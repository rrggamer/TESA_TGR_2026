; PlatformIO Project Configuration
; Track 1 - Sensing : ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM)

[platformio]
default_envs = esp32s3_usb

; ---------- common settings ----------
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 specific: 16 MB QIO flash + 8 MB OPI PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; competition rule 3.2: serial at 9600 baud
monitor_speed = 9600
monitor_filters = esp32_exception_decoder

; CORE_DEBUG_LEVEL=0 keeps ESP log lines out of the judged serial output
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

; ---------- competition firmware, native USB port (USB-OTG, 303a:1001) ----------
[env:esp32s3_usb]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- calibration firmware: raw timing stats, serial key also triggers ----------
[env:esp32s3_cal]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCAL_MODE=1

; ---------- UART bridge port (CH343, USB ID 1a86:55d3) ----------
; The CH343 uses the cdc_acm driver, so it also shows up as /dev/ttyACM0.
; Serial goes to UART0 (GPIO43/44) at a genuine 9600 baud.
[env:esp32s3_uart]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32s3_cal_uart]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 460800
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCAL_MODE=1

; ---------- standalone button test (examples/button_test), UART port ----------
[env:button_test]
build_src_filter = -<*> +<../examples/button_test/>
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------- day 2: competition firmware printing "Moisture Level = xx.xx %", UART port ----------
[env:esp32s3_moist_uart]
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DOUTPUT_MOISTURE=1
